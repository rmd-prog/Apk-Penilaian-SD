<!doctype html><html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SI-NILAI SD V7 — 2026/2027</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{--nav:#0f172a;--primary:#2563eb;--bg:#f1f5f9;--card:#fff;--text:#172033;--muted:#64748b;--line:#dbe3ec;--ok:#166534;--okbg:#dcfce7;--warn:#92400e;--warnbg:#fef3c7;--danger:#b91c1c}
*{box-sizing:border-box}html,body,#root{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{border:0;border-radius:10px;padding:10px 14px;background:var(--primary);color:#fff;cursor:pointer}button.secondary{background:#e2e8f0;color:#0f172a}button.danger{background:#fee2e2;color:var(--danger)}button.small{padding:7px 10px;font-size:13px}
.app{min-height:100vh}.top{background:var(--nav);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:20}.top h1{margin:0;font-size:20px}.top small{opacity:.8}.layout{display:flex;min-height:calc(100vh - 67px)}.side{width:235px;background:#111827;color:#fff;padding:12px;position:sticky;top:67px;height:calc(100vh - 67px);overflow:auto}.side button{display:block;width:100%;text-align:left;background:transparent;margin:3px 0;color:#dbeafe}.side button.active{background:#2563eb}.content{flex:1;padding:16px;max-width:1250px;margin:auto;width:100%}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px #0f172a12}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:4px}.field input,.field select,.field textarea,input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff}.field textarea,textarea{resize:vertical}.muted{color:var(--muted)}.notice{padding:11px 13px;border-radius:10px;margin-bottom:12px}.ok{background:var(--okbg);color:var(--ok)}.warn{background:var(--warnbg);color:var(--warn)}.pill{display:inline-block;background:#eff6ff;color:#1d4ed8;border-radius:99px;padding:5px 9px;font-size:12px;margin:3px}.actions{display:flex;gap:8px;flex-wrap:wrap}.stat{font-size:28px;font-weight:800;margin-top:5px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:700px}th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top;font-size:13px}th{background:#f8fafc}.mobileMenu{display:none}.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.sectionTitle{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.sectionTitle h2{margin:0 0 6px}.chapterList{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}.chapter{padding:11px;border:1px solid var(--line);border-radius:10px;background:#f8fafc}.chapter b{display:block}.hr{border:0;border-top:1px solid var(--line);margin:15px 0}
@media(max-width:800px){.side{display:none}.mobileMenu{display:block;background:#fff;border-bottom:1px solid var(--line);padding:8px;position:sticky;top:67px;z-index:15;overflow:auto;white-space:nowrap}.mobileMenu button{margin-right:5px}.row{grid-template-columns:1fr}.content{padding:10px}.top h1{font-size:18px}table{min-width:850px}}
</style></head><body><div id="root"></div>
<script type="text/babel">
const {useState,useEffect}=React;
const KEY='sinilai-sd-v7-2026-2027';
const BOOKS={
'I|Bahasa Indonesia':{title:'Bahasa Indonesia: Aku Bisa! untuk SD/MI Kelas I (Edisi Revisi)',isbn:'978-623-118-362-0',chapters:['Bunyi Apa?','Ayo, Bermain!','Awas Kuman!','Aku Bisa!','Teman Baru','Berbeda Itu Tak Apa','Aku Ingin','Di Sekitar Rumah']},
'II|Bahasa Indonesia':{title:'Bahasa Indonesia: Keluargaku Unik untuk SD/MI Kelas II (Edisi Revisi)',isbn:'978-623-388-133-3',chapters:['Mengenal Perasaan','Menjaga Kesehatan','Berhati-hati di Mana Saja','Keluargaku Unik','Berteman dalam Keragaman','Bijak Memakai Uang','Sayang Lingkungan','Hobi yang Jadi Prestasi']},
'III|Bahasa Indonesia':{title:'Bahasa Indonesia: Kawan Seiring untuk SD/MI Kelas III (Edisi Revisi)',isbn:'978-634-00-3315-1',chapters:['Ayo, Main!','Kawan Seiring','Pengobar Semangat','Senyum di Sekitarku','Bola-Bola Cokelat','Tersesat','Aku dan si Merah']},
'IV|Bahasa Indonesia':{title:'Bahasa Indonesia: Lihat Sekitar untuk SD/MI Kelas IV (Edisi Revisi)',isbn:'978-623-118-363-7',chapters:['Sudah Besar','Di Bawah Atap','Lihat Sekitar','Meliuk dan Menerjang','Bertukar dan Membayar','Satu Titik','Asal-Usul','Sehatlah Ragaku']},
'V|Bahasa Indonesia':{title:'Bahasa Indonesia: Bergerak Bersama untuk SD/MI Kelas V (Edisi Revisi)',isbn:'978-623-388-134-0',chapters:['Aku yang Unik','Buku Jendela Dunia','Ekspresi Diri melalui Hobi','Belajar Berwirausaha','Menjadi Warga Dunia','Cinta Indonesia','Sayangi Bumi','Bergerak Bersama']},
'VI|Bahasa Indonesia':{title:'Bahasa Indonesia: Anak-Anak yang Mengubah Dunia untuk SD/MI Kelas VI (Edisi Revisi)',isbn:'978-634-00-2617-7',chapters:['Bangga Menjadi Anak Indonesia','Musisi Indonesia di Pentas Dunia','Taman Nasional dan Situs Warisan Dunia','Jeda untuk Iklim','Anak-Anak yang Mengubah Dunia','Liburan Perpisahan Kelas','Aku Bisa Berempati','Aman di Dunia Maya']},
'IV|IPAS':{title:'Ilmu Pengetahuan Alam dan Sosial untuk SD/MI Kelas IV (Edisi Revisi)',isbn:'978-623-118-445-0',chapters:['Tumbuhan, Sumber Kehidupan di Bumi','Wujud Zat dan Perubahannya','Gaya di Sekitar Kita','Mengubah Bentuk Energi','Cerita Tentang Daerahku','Indonesiaku Kaya Budaya','Bagaimana Mendapatkan Semua Kebutuhan Kita?','Membangun Masyarakat yang Beradab']},
'IV|Pendidikan Pancasila':{title:'Pendidikan Pancasila untuk SD/MI Kelas IV',isbn:'978-623-194-650-8',chapters:['Mengenal Lingkungan Sekitar','Aku Anak yang Disiplin','Kerja Sama di Lingkunganku','Pancasila dalam Diriku']},
'IV|Matematika':{title:'Matematika untuk SD/MI Kelas IV',isbn:'978-602-244-908-9',chapters:['Bilangan Cacah sampai 10.000','Pecahan','Pola Gambar dan Pola Bilangan','Pengukuran Luas dan Volume','Bangun Datar','Piktogram dan Diagram Batang']}
};
const subjects=['Bahasa Indonesia','Pendidikan Pancasila','Matematika','IPAS','PJOK','Seni Rupa','Seni Musik','Seni Tari','Seni Teater','Bahasa Inggris','Pendidikan Agama dan Budi Pekerti'];
const menus=['Dashboard','Data Siswa','CP','TP','ATP','Prota','Prosem','RPM Deep Learning','Penilaian Per BAB','Rapor','Import Data'];
const blank={school:{name:'SD Contoh',teacher:'',nip:'',year:'2026/2027'},students:[],scores:{},docs:{},rpm:{}};
function load(){try{return {...blank,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return blank}}
function App(){
 const [tab,setTab]=useState('Dashboard'),[kelas,setKelas]=useState('IV'),[mapel,setMapel]=useState('Bahasa Indonesia'),[db,setDb]=useState(load),[notice,setNotice]=useState('');
 const key=kelas+'|'+mapel, book=BOOKS[key], chapters=book?.chapters||[];
 useEffect(()=>localStorage.setItem(KEY,JSON.stringify(db)),[db]);
 const patch=(p)=>setDb(d=>({...d,...p}));
 const addStudent=()=>setDb(d=>({...d,students:[...d.students,{id:Date.now(),name:'Siswa Baru',nis:'',nisn:'',gender:'',address:''}]}));
 const updateStudent=(id,k,v)=>setDb(d=>({...d,students:d.students.map(s=>s.id===id?{...s,[k]:v}:s)}));
 const removeStudent=id=>{if(confirm('Hapus siswa ini?'))setDb(d=>({...d,students:d.students.filter(s=>s.id!==id)}))};
 const setScore=(id,chapter,v)=>setDb(d=>({...d,scores:{...d.scores,[key]:{...(d.scores[key]||{}),[id]:{...(d.scores[key]?.[id]||{}),[chapter]:v}}}}));
 const setFinal=(id,v)=>setScore(id,'__FINAL__',v);
 const docKey=key+'|'+tab; const doc=db.docs[docKey]||'';
 const saveDoc=v=>setDb(d=>({...d,docs:{...d.docs,[docKey]:v}}));
 const backup=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='SI-NILAI-SD-V7-backup.json';a.click();setNotice('Backup JSON berhasil dibuat.')};
 const restore=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);setDb({...blank,...x});setNotice('Backup berhasil dipulihkan.')}catch{setNotice('File JSON tidak valid.')}};r.readAsText(f)};
 const reset=()=>{if(confirm('Hapus semua data lokal aplikasi? Tindakan ini tidak dapat dibatalkan.')){setDb(blank);setNotice('Data lokal dihapus.')}};
 const scoreVal=(id,c)=>db.scores[key]?.[id]?.[c]??'';
 const avg=id=>{const vals=chapters.map(c=>Number(scoreVal(id,c))).filter(n=>n>=0&&n<=100&&!Number.isNaN(n));return vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):0};
 const finalVal=id=>scoreVal(id,'__FINAL__')!==''?scoreVal(id,'__FINAL__'):avg(id);
 const pred=n=>n>=90?'Sangat Baik':n>=80?'Baik':n>=70?'Cukup':n>0?'Perlu Bimbingan':'-';
 const renderDoc=(title,help,placeholder)=> <div className="card"><div className="sectionTitle"><div><h2>{title}</h2><p className="muted">{help}</p></div><span className="pill">Kelas {kelas} • {mapel}</span></div><textarea rows="14" value={doc} onChange={e=>saveDoc(e.target.value)} placeholder={placeholder}/><div className="actions"><button onClick={()=>{saveDoc(doc);setNotice(title+' tersimpan di perangkat ini.')}}>Simpan</button><button className="secondary" onClick={()=>{saveDoc('');setNotice(title+' dikosongkan.')}}>Kosongkan</button></div></div>;
 return <div className="app"><header className="top"><h1>SI-NILAI SD V7</h1><small>Kurikulum Merdeka • Tahun Ajaran 2026/2027 • Penilaian BAB SIBI • STS tidak digunakan</small></header>
 <div className="layout"><aside className="side">{menus.map(m=><button className={tab===m?'active':''} onClick={()=>setTab(m)} key={m}>{m}</button>)}</aside>
 <div className="mobileMenu">{menus.map(m=><button className={tab===m?'':'secondary'} onClick={()=>setTab(m)} key={m}>{m}</button>)}</div>
 <main className="content">{notice&&<div className="notice ok">{notice}</div>}
 <div className="card"><div className="row"><div className="field"><label>Kelas</label><select value={kelas} onChange={e=>setKelas(e.target.value)}>{['I','II','III','IV','V','VI'].map(x=><option key={x}>{x}</option>)}</select></div><div className="field"><label>Mata Pelajaran</label><select value={mapel} onChange={e=>setMapel(e.target.value)}>{subjects.map(x=><option key={x}>{x}</option>)}</select></div></div>{book?<div><span className="pill">Buku SIBI terverifikasi</span> <span className="muted">{book.title} • ISBN {book.isbn}</span></div>:<div className="notice warn">Referensi BAB SIBI untuk kombinasi Kelas {kelas} • {mapel} belum dimasukkan. Aplikasi sengaja tidak mengarang judul BAB.</div>}</div>
 {tab==='Dashboard'&&<><div className="grid"><div className="card"><div className="muted">Peserta Didik</div><div className="stat">{db.students.length}</div></div><div className="card"><div className="muted">BAB SIBI aktif</div><div className="stat">{chapters.length}</div></div><div className="card"><div className="muted">Nilai terisi</div><div className="stat">{Object.values(db.scores[key]||{}).reduce((a,s)=>a+Object.keys(s).filter(k=>k!=='__FINAL__'&&s[k]!==''&&s[k]!=null).length,0)}</div></div><div className="card"><div className="muted">Status penyimpanan</div><div className="stat">Lokal</div></div></div><div className="card"><h2>{db.school.name||'SD Contoh'}</h2><p>Alur kerja: <b>Data Siswa → CP → TP → ATP → Prota → Prosem → RPM → Penilaian per BAB → Rapor</b>.</p><p className="muted">Data tersimpan di browser/perangkat. Untuk sistem sekolah multi-user, aplikasi perlu backend/API + PostgreSQL; GitHub Pages sendiri hanya untuk frontend statis.</p></div><div className="card"><h3>Menu utama V7</h3><div className="chapterList">{menus.map(m=><div className="chapter" key={m} onClick={()=>setTab(m)}><b>{m}</b><span className="muted">Buka modul</span></div>)}</div></div></>}
 {tab==='Data Siswa'&&<div className="card"><div className="sectionTitle"><div><h2>Data Siswa</h2><p className="muted">Daftar peserta didik yang digunakan dalam penilaian dan rapor.</p></div><button onClick={addStudent}>+ Tambah Siswa</button></div><div className="tablewrap">{db.students.length?<table><thead><tr><th>Nama</th><th>NIS</th><th>NISN</th><th>L/P</th><th>Alamat</th><th>Aksi</th></tr></thead><tbody>{db.students.map(s=><tr key={s.id}><td><input value={s.name} onChange={e=>updateStudent(s.id,'name',e.target.value)}/></td><td><input value={s.nis} onChange={e=>updateStudent(s.id,'nis',e.target.value)}/></td><td><input value={s.nisn} onChange={e=>updateStudent(s.id,'nisn',e.target.value)}/></td><td><select value={s.gender} onChange={e=>updateStudent(s.id,'gender',e.target.value)}><option value="">-</option><option>L</option><option>P</option></select></td><td><input value={s.address} onChange={e=>updateStudent(s.id,'address',e.target.value)}/></td><td><button className="danger small" onClick={()=>removeStudent(s.id)}>Hapus</button></td></tr>)}</tbody></table>:<div className="empty">Belum ada siswa. Tekan “Tambah Siswa”.</div>}</div></div>}
 {['CP','TP','ATP','Prota','Prosem'].includes(tab)&&renderDoc(tab,tab==='CP'?'Capaian Pembelajaran per kelas dan mata pelajaran.':tab==='TP'?'Tujuan Pembelajaran yang dikaitkan dengan pembelajaran.':tab==='ATP'?'Alur Tujuan Pembelajaran.':tab==='Prota'?'Program Tahunan.':'Program Semester.',`Tulis ${tab} untuk Kelas ${kelas} — ${mapel}...`)}
 {tab==='RPM Deep Learning'&&<div className="card"><div className="sectionTitle"><div><h2>RPM Deep Learning per BAB</h2><p className="muted">Satu rancangan untuk setiap BAB SIBI yang tersedia.</p></div></div>{chapters.length?<div>{chapters.map((c,i)=>{const rk=key+'|'+c;const r=db.rpm[rk]||{tujuan:'',memahami:'',mengaplikasi:'',merefleksi:'',tindak:''};const save=v=>setDb(d=>({...d,rpm:{...d.rpm,[rk]:v}}));return <div className="card" style={{background:'#f8fafc'}} key={c}><h3>BAB {i+1} — {c}</h3><div className="field"><label>Tujuan/Kebutuhan Belajar</label><textarea rows="3" value={r.tujuan} onChange={e=>save({...r,tujuan:e.target.value})}/></div><div className="row"><div className="field"><label>Memahami</label><textarea rows="4" value={r.memahami} onChange={e=>save({...r,memahami:e.target.value})}/></div><div className="field"><label>Mengaplikasi</label><textarea rows="4" value={r.mengaplikasi} onChange={e=>save({...r,mengaplikasi:e.target.value})}/></div></div><div className="row"><div className="field"><label>Merefleksi</label><textarea rows="4" value={r.merefleksi} onChange={e=>save({...r,merefleksi:e.target.value})}/></div><div className="field"><label>Tindak Lanjut</label><textarea rows="4" value={r.tindak} onChange={e=>save({...r,tindak:e.target.value})}/></div></div></div>})}</div>:<div className="empty">Belum ada referensi BAB SIBI untuk pilihan ini.</div>}</div>}
 {tab==='Penilaian Per BAB'&&<div className="card"><div className="sectionTitle"><div><h2>Penilaian Per BAB</h2><p className="muted">Masukkan nilai 0–100. Nilai akhir semester dapat diisi manual; jika kosong, rapor memakai rata-rata nilai BAB.</p></div><button onClick={()=>setTab('Data Siswa')}>Kelola Siswa</button></div>{chapters.length?<><div className="chapterList">{chapters.map((c,i)=><div className="chapter" key={c}><b>BAB {i+1}</b>{c}</div>)}</div><hr className="hr"/><div className="tablewrap"><table><thead><tr><th>Siswa</th>{chapters.map((c,i)=><th key={c}>B{i+1}</th>)}<th>Akhir Sem.</th><th>Rata-rata</th></tr></thead><tbody>{db.students.length?db.students.map(s=><tr key={s.id}><td><b>{s.name||'Tanpa nama'}</b><br/><span className="muted">{s.nisn||s.nis||''}</span></td>{chapters.map(c=><td key={c}><input type="number" min="0" max="100" value={scoreVal(s.id,c)} onChange={e=>setScore(s.id,c,e.target.value)}/></td>)}<td><input type="number" min="0" max="100" value={scoreVal(s.id,'__FINAL__')} onChange={e=>setFinal(s.id,e.target.value)}/></td><td><b>{avg(s.id)||'-'}</b></td></tr>):<tr><td colSpan={chapters.length+3}>Belum ada siswa.</td></tr>}</tbody></table></div></>:<div className="empty">BAB SIBI belum tersedia untuk pilihan Kelas {kelas} — {mapel}.</div>}</div>}
 {tab==='Rapor'&&<div className="card"><div className="sectionTitle"><div><h2>Rapor</h2><p className="muted">Rekap nilai per siswa untuk Kelas {kelas} — {mapel}.</p></div><button className="secondary" onClick={()=>window.print()}>Cetak / Simpan PDF</button></div><div className="field"><label>Nama Sekolah</label><input value={db.school.name} onChange={e=>patch({school:{...db.school,name:e.target.value}})}/></div><div className="row"><div className="field"><label>Nama Guru</label><input value={db.school.teacher} onChange={e=>patch({school:{...db.school,teacher:e.target.value}})}/></div><div className="field"><label>NIP</label><input value={db.school.nip} onChange={e=>patch({school:{...db.school,nip:e.target.value}})}/></div></div><div className="tablewrap"><table><thead><tr><th>No</th><th>Nama</th><th>NISN</th><th>Mapel</th><th>Nilai</th><th>Predikat</th></tr></thead><tbody>{db.students.map((s,i)=>{const n=Number(finalVal(s.id)||0);return <tr key={s.id}><td>{i+1}</td><td>{s.name}</td><td>{s.nisn||s.nis}</td><td>{mapel}</td><td>{n||'-'}</td><td>{pred(n)}</td></tr>})}</tbody></table></div></div>}
 {tab==='Import Data'&&<div className="card"><h2>Import & Backup</h2><p className="muted">Gunakan backup JSON untuk memindahkan data antar perangkat. Format ini menyimpan siswa, nilai, dokumen, RPM, dan identitas sekolah.</p><div className="actions"><button onClick={backup}>Download Backup JSON</button><label><button className="secondary">Pilih File JSON</button><input style={{display:'none'}} type="file" accept="application/json,.json" onChange={restore}/></label><button className="danger" onClick={reset}>Hapus Semua Data Lokal</button></div><hr className="hr"/><h3>Referensi SIBI yang tersedia di V7</h3>{Object.entries(BOOKS).map(([k,b])=><div className="chapter" key={k}><b>{k.replace('|',' • ')}</b><div>{b.title}</div><span className="muted">{b.chapters.length} BAB • ISBN {b.isbn}</span></div>)}<div className="notice warn" style={{marginTop:10}}>Untuk kombinasi buku yang belum diverifikasi, V7 tidak membuat nama BAB secara otomatis.</div></div>}
 </main></div></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
