<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1d4ed8"><title>SI-NILAI SD 2026/2027</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#172033}.app{display:flex;min-height:100vh}aside{width:230px;background:#0f172a;color:white;padding:16px;position:fixed;top:0;bottom:0;overflow:auto}.logo{font-size:20px;font-weight:bold;margin-bottom:18px}.logo small{display:block;color:#93c5fd;font-size:12px;margin-top:4px}nav button{width:100%;padding:10px;margin:2px 0;border:0;border-radius:8px;background:transparent;color:#cbd5e1;text-align:left}nav button.active,nav button:hover{background:#2563eb;color:white}main{margin-left:230px;width:calc(100% - 230px);padding:20px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}h1,h2{margin-top:0}.badge{background:#dbeafe;color:#1d4ed8;padding:8px 12px;border-radius:20px;font-weight:bold}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0000000b}.card b{font-size:26px;display:block}.muted{color:#64748b}.quick{display:flex;gap:8px;flex-wrap:wrap}button{background:#2563eb;color:white;border:0;border-radius:8px;padding:10px 13px}button.red{background:#dc2626}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;background:white}textarea{margin:10px 0}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #e2e8f0;text-align:left}.table{overflow:auto}.score{width:90px}@media(max-width:750px){aside{width:65px;padding:8px}.logo b,.logo small{display:none}nav button{font-size:0;text-align:center}nav button:after{content:"•";font-size:20px}main{margin-left:65px;width:calc(100% - 65px);padding:12px}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}h1{font-size:21px}.badge{display:none}}@media print{aside,header,button{display:none!important}main{margin:0;width:100%}}
</style></head><body><div id="root"></div>
<script>
const S=["Pendidikan Agama dan Budi Pekerti","Pendidikan Pancasila","Bahasa Indonesia","Matematika","IPAS","PJOK","Seni","Bahasa Inggris"];
const N=[["dashboard","Dashboard"],["sekolah","Profil Sekolah"],["siswa","Data Siswa"],["guru","Data Guru"],["cp","CP"],["tp","TP"],["atp","ATP"],["prota","Prota"],["prosem","Prosem"],["nilai","Penilaian"],["rekap","Rekap Nilai"],["rapor","Rapor"],["backup","Backup"]];
let state=JSON.parse(localStorage.getItem("sinilai")||"null")||{page:"dashboard",school:{nama:"SD Contoh",npsn:"",alamat:"",kepala:""},students:[],teachers:[],plans:{},grades:{}};
function save(){localStorage.setItem("sinilai",JSON.stringify(state))}
function esc(x){return String(x??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
function pred(v){v=Number(v);return !v?"—":v>=90?"Sangat Baik":v>=80?"Baik":v>=70?"Cukup":"Perlu Bimbingan"}
function render(){
let p=state.page,title=(N.find(x=>x[0]==p)||["","Dashboard"])[1];
document.getElementById("root").innerHTML=`<div class="app"><aside><div class="logo">📘 <b>SI-NILAI SD</b><small>TA 2026/2027</small></div><nav>${N.map(x=>`<button class="${p==x[0]?"active":""}" onclick="go('${x[0]}')">${x[1]}</button>`).join("")}</nav></aside><main><header><div><h1>${title}</h1><span class="muted">Kurikulum Merdeka • Fase A, B, C</span></div><span class="badge">2026/2027</span></header>${content(p)}</main></div>`}
function go(p){state.page=p;save();render()}
function content(p){
if(p=="dashboard")return `<div class="cards"><div class="card"><b>${state.students.length}</b><span>Peserta Didik</span></div><div class="card"><b>${Object.keys(state.grades).length}</b><span>Nilai Terisi</span></div><div class="card"><b>${S.length}</b><span>Mata Pelajaran</span></div><div class="card"><b>A–C</b><span>Fase</span></div></div><div class="panel"><h2>${esc(state.school.nama)}</h2><p>${esc(state.school.alamat)}</p><div class="quick"><button onclick="go('siswa')">Data Siswa</button><button onclick="go('cp')">CP</button><button onclick="go('atp')">ATP</button><button onclick="go('nilai')">Input Nilai</button><button onclick="go('rapor')">Rapor</button></div></div><div class="panel"><h2>Acuan 2026/2027</h2><p>CP Pendidikan Agama dan Budi Pekerti mengikuti Keputusan Kepala BKPDM Nomor 020 Tahun 2026. Mata pelajaran lainnya mengacu Keputusan Kepala BSKAP Nomor 046/H/KR/2025.</p></div>`;
if(p=="sekolah")return `<div class="panel"><h2>Profil Sekolah</h2><div class="grid">${["nama","npsn","alamat","kepala"].map(k=>`<label>${k.toUpperCase()}<input id="sc_${k}" value="${esc(state.school[k])}"></label>`).join("")}</div><br><button onclick="schoolSave()">Simpan</button></div>`;
if(p=="siswa")return `<div class="panel"><h2>Tambah Siswa</h2><div class="grid"><input id="sn" placeholder="Nama lengkap"><input id="si" placeholder="NISN"><select id="sk">${[1,2,3,4,5,6].map(x=>`<option>${x}A</option>`).join("")}</select></div><br><button onclick="addStudent()">+ Tambah</button></div><div class="panel"><h2>Daftar Siswa</h2><div class="table"><table><tr><th>Nama</th><th>NISN</th><th>Kelas</th><th></th></tr>${state.students.map((s,i)=>`<tr><td>${esc(s.name)}</td><td>${esc(s.nisn)}</td><td>${esc(s.class)}</td><td><button class="red" onclick="delStudent(${i})">Hapus</button></td></tr>`).join("")}</table></div></div>`;
if(p=="guru")return `<div class="panel"><h2>Tambah Guru</h2><div class="grid"><input id="gn" placeholder="Nama guru"><input id="gi" placeholder="NIP"><button onclick="addTeacher()">+ Tambah</button></div></div><div class="panel"><table><tr><th>Nama</th><th>NIP</th></tr>${state.teachers.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.nip)}</td></tr>`).join("")}</table></div>`;
if(["cp","tp","atp","prota","prosem"].includes(p)){let lab={cp:"Capaian Pembelajaran",tp:"Tujuan Pembelajaran",atp:"Alur Tujuan Pembelajaran",prota:"Program Tahunan",prosem:"Program Semester"}[p];return `<div class="panel"><h2>${lab}</h2><p class="muted">Silakan masukkan dokumen/data ${lab} sekolah.</p><select id="plsub">${S.map(x=>`<option>${x}</option>`).join("")}</select><select id="plfase"><option>Fase A</option><option>Fase B</option><option>Fase C</option></select><textarea id="pl" rows="14" placeholder="Tulis ${lab}...">${esc(state.plans[p]||"")}</textarea><button onclick="planSave('${p}')">Simpan</button></div>`}
if(p=="nilai")return `<div class="panel"><h2>Input Penilaian</h2><div class="grid"><select id="vs">${S.map(x=>`<option>${x}</option>`).join("")}</select><select id="vk"><option>Sumatif</option><option>Formatif</option><option>Tugas</option><option>Praktik</option><option>Proyek</option></select><select><option>Semester 1</option><option>Semester 2</option></select></div></div><div class="panel"><div class="table"><table><tr><th>Siswa</th><th>Nilai</th><th>Predikat</th></tr>${state.students.map(s=>{let key=s.id+"|"+document.getElementById("vs")?.value+"|"+document.getElementById("vk")?.value;let v=state.grades[key]||"";return `<tr><td>${esc(s.name)}</td><td><input class="score" type="number" min="0" max="100" value="${v}" oninput="grade('${s.id}',this.value)"></td><td>${pred(v)}</td></tr>`}).join("")}</table></div></div>`;
if(p=="rekap"){return `<div class="panel"><div class="table"><table><tr><th>Siswa</th>${S.map(x=>`<th>${x.split(" ")[0]}</th>`).join("")}<th>Rata-rata</th></tr>${state.students.map(s=>{let a=S.map(sub=>{let k=Object.keys(state.grades).find(k=>k.startsWith(s.id+"|"+sub+"|"));return k?Number(state.grades[k])||0:0}),b=a.filter(Boolean),avg=b.length?(b.reduce((x,y)=>x+y,0)/b.length).toFixed(1):"—";return `<tr><td>${esc(s.name)}</td>${a.map(v=>`<td>${v||"—"}</td>`).join("")}<td><b>${avg}</b></td></tr>`}).join("")}</table></div></div>`}
if(p=="rapor")return state.students.map(s=>`<div class="panel"><h2>${esc(state.school.nama)}</h2><h3>Rapor — ${esc(s.name)} — Kelas ${s.class}</h3><table><tr><th>Mata Pelajaran</th><th>Nilai</th><th>Deskripsi</th></tr>${S.map(sub=>{let k=Object.keys(state.grades).find(k=>k.startsWith(s.id+"|"+sub+"|"));let v=k?Number(state.grades[k])||0:0;return `<tr><td>${sub}</td><td>${v||"—"}</td><td>${v>=90?"Sangat baik dalam mencapai tujuan pembelajaran.":v>=80?"Baik dalam mencapai tujuan pembelajaran.":v>=70?"Cukup dan perlu penguatan.":"Memerlukan bimbingan dan tindak lanjut."}</td></tr>`}).join("")}</table><br><button onclick="print()">Cetak Rapor</button></div>`).join("");
if(p=="backup")return `<div class="panel"><h2>Backup Data</h2><p>Unduh seluruh data aplikasi ke file JSON.</p><button onclick="backup()">⬇ Download Backup</button></div>`;
return "";
}
function schoolSave(){for(let k of ["nama","npsn","alamat","kepala"])state.school[k]=document.getElementById("sc_"+k).value;save();alert("Profil tersimpan")}
function addStudent(){let n=document.getElementById("sn").value;if(!n)return;state.students.push({id:"S"+Date.now(),name:n,nisn:document.getElementById("si").value,class:document.getElementById("sk").value});save();render()}
function delStudent(i){state.students.splice(i,1);save();render()}
function addTeacher(){let n=document.getElementById("gn").value;if(!n)return;state.teachers.push({name:n,nip:document.getElementById("gi").value});save();render()}
function planSave(p){state.plans[p]=document.getElementById("pl").value;save();alert("Tersimpan")}
function grade(id,v){let sub=document.getElementById("vs").value,kind=document.getElementById("vk").value;state.grades[id+"|"+sub+"|"+kind]=v;save()}
function backup(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}));a.download="backup-si-nilai-sd-2026-2027.json";a.click()}
render();
</script></body></html>
