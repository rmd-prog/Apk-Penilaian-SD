<!doctype html><html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SI-NILAI SD V5 — SIBI 2026/2027</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}
header{background:#123c69;color:#fff;padding:16px;position:sticky;top:0;z-index:4}header h1{margin:0;font-size:21px}
nav{display:flex;gap:7px;overflow:auto;background:#fff;padding:9px;border-bottom:1px solid #ddd;position:sticky;top:70px;z-index:3}
button{border:0;border-radius:9px;padding:10px 13px;background:#1769aa;color:#fff}nav button{background:#edf3f8;color:#123c69;white-space:nowrap}.active{background:#1769aa!important;color:#fff!important}
main{max-width:1200px;margin:auto;padding:14px}.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:13px;box-shadow:0 2px 10px #0001}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input,select,textarea{width:100%;padding:10px;border:1px solid #ccd6e0;border-radius:8px;margin:4px 0 9px}
table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #e3e8ee;padding:8px;font-size:13px;text-align:left}
.tag{display:inline-block;padding:5px 8px;margin:3px;border-radius:99px;background:#e9f3ff;color:#15568b;font-size:12px}
.muted{color:#68788c;font-size:13px}.ok{background:#e9f8ef}.warn{background:#fff7df}.danger{background:#c0392b}
@media(max-width:650px){.row{grid-template-columns:1fr}nav{top:67px}}
</style></head><body><div id="root"></div>
<script type="text/babel">
const {useState,useEffect}=React;
const BOOKS={
"I|Bahasa Indonesia":{title:"Bahasa Indonesia: Aku Bisa! untuk SD/MI Kelas I (Edisi Revisi)",isbn:"978-623-118-362-0",chapters:["Bunyi Apa?","Ayo, Bermain!","Awas Kuman!","Aku Bisa!","Teman Baru","Berbeda Itu Tak Apa","Aku Ingin","Di Sekitar Rumah"]},
"II|Bahasa Indonesia":{title:"Bahasa Indonesia: Keluargaku Unik untuk SD/MI Kelas II (Edisi Revisi)",isbn:"978-623-388-133-3",chapters:["Mengenal Perasaan","Menjaga Kesehatan","Berhati-hati di Mana Saja","Keluargaku Unik","Berteman dalam Keragaman","Bijak Memakai Uang","Sayang Lingkungan","Hobi yang Jadi Prestasi"]},
"III|Bahasa Indonesia":{title:"Bahasa Indonesia: Kawan Seiring untuk SD/MI Kelas III (Edisi Revisi)",isbn:"978-634-00-3315-1",chapters:["Ayo, Main!","Kawan Seiring","Pengobar Semangat","Senyum di Sekitarku","Bola-Bola Cokelat","Tersesat","Aku dan si Merah"]},
"IV|Bahasa Indonesia":{title:"Bahasa Indonesia: Lihat Sekitar untuk SD/MI Kelas IV (Edisi Revisi)",isbn:"978-623-118-363-7",chapters:["Sudah Besar","Di Bawah Atap","Lihat Sekitar","Meliuk dan Menerjang","Bertukar dan Membayar","Satu Titik","Asal-Usul","Sehatlah Ragaku"]},
"V|Bahasa Indonesia":{title:"Bahasa Indonesia: Bergerak Bersama untuk SD/MI Kelas V (Edisi Revisi)",isbn:"978-623-388-134-0",chapters:["Aku yang Unik","Buku Jendela Dunia","Ekspresi Diri melalui Hobi","Belajar Berwirausaha","Menjadi Warga Dunia","Cinta Indonesia","Sayangi Bumi","Bergerak Bersama"]},
"VI|Bahasa Indonesia":{title:"Bahasa Indonesia: Anak-Anak yang Mengubah Dunia untuk SD/MI Kelas VI (Edisi Revisi)",isbn:"978-634-00-2617-7",chapters:["Anak-Anak yang Mengubah Dunia","Musisi Indonesia di Pentas Dunia","Taman Nasional dan Situs Warisan Dunia","Jeda untuk Iklim","Anak-Anak yang Mengubah Dunia","Liburan Perpisahan Kelas","Aku Bisa Berempati","Aman di Dunia Maya"]},
"IV|IPAS":{title:"Ilmu Pengetahuan Alam dan Sosial untuk SD/MI Kelas IV (Edisi Revisi)",isbn:"978-623-118-445-0",chapters:["Tumbuhan, Sumber Kehidupan di Bumi","Wujud Zat dan Perubahannya","Gaya di Sekitar Kita","Mengubah Bentuk Energi","Cerita Tentang Daerahku","Indonesiaku Kaya Budaya","Bagaimana Mendapatkan Semua Kebutuhan Kita?","Membangun Masyarakat yang Beradab"]},
"IV|Pendidikan Pancasila":{title:"Pendidikan Pancasila untuk SD/MI Kelas IV",isbn:"978-623-194-650-8",chapters:["Mengenal Lingkungan Sekitar","Aku Anak yang Disiplin","Kerja Sama di Lingkunganku","Pancasila dalam Diriku"]},
"IV|Matematika":{title:"Matematika untuk SD/MI Kelas IV",isbn:"978-602-244-908-9",chapters:["Bilangan Cacah sampai 10.000","Pecahan","Pola Gambar dan Pola Bilangan","Pengukuran Luas dan Volume","Bangun Datar","Piktogram dan Diagram Batang"]}
};
const subjects=["Bahasa Indonesia","Pendidikan Pancasila","Matematika","IPAS","PJOK","Seni Rupa","Seni Musik","Seni Tari","Seni Teater","Bahasa Inggris","Pendidikan Agama dan Budi Pekerti"];
const menu=["Dashboard","CP","TP","ATP","Prota","Prosem","RPM Deep Learning","Penilaian Per BAB","Rapor","Import Data"];
const blank={students:[],scores:{},notes:{}};
function getDB(){try{return JSON.parse(localStorage.getItem("sinilai-v5"))||blank}catch{return blank}}
function App(){
 const [tab,setTab]=useState("Dashboard"),[kelas,setKelas]=useState("IV"),[mapel,setMapel]=useState("Bahasa Indonesia");
 const [db,setDb]=useState(getDB),[notice,setNotice]=useState("");
 const book=BOOKS[kelas+"|"+mapel], chapters=book?.chapters||[];
 useEffect(()=>localStorage.setItem("sinilai-v5",JSON.stringify(db)),[db]);
 const add=()=>setDb({...db,students:[...db.students,{id:Date.now(),name:"Siswa Baru",nis:""}]});
 const del=id=>setDb({...db,students:db.students.filter(s=>s.id!==id)});
 const upd=(id,k,v)=>setDb({...db,students:db.students.map(s=>s.id===id?{...s,[k]:v}:s)});
 const score=(id,k,v)=>setDb({...db,scores:{...db.scores,[id]:{...(db.scores[id]||{}),[k]:v}}});
 const backup=()=>{let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));a.download="backup-si-nilai-v5.json";a.click()};
 const restore=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{setDb(JSON.parse(r.result));setNotice("Backup berhasil dipulihkan.")}catch{setNotice("JSON tidak valid.")}};r.readAsText(f)};
 const message=<>{notice&&<div className="card ok">{notice}</div>}</>;
 return <><header><h1>SI-NILAI SD V5</h1><small>Kurikulum Merdeka • 2026/2027 • Penilaian BAB SIBI • STS TIDAK DIGUNAKAN</small></header>
 <nav>{menu.map(m=><button className={tab===m?"active":""} onClick={()=>setTab(m)}>{m}</button>)}</nav><main>{message}
 <div className="card"><div className="row"><div><b>Kelas</b><select value={kelas} onChange={e=>setKelas(e.target.value)}>{["I","II","III","IV","V","VI"].map(x=><option>{x}</option>)}</select></div><div><b>Mata Pelajaran</b><select value={mapel} onChange={e=>setMapel(e.target.value)}>{subjects.map(x=><option>{x}</option>)}</select></div></div>{book?<><div className="tag">Buku SIBI tersedia</div><span className="muted">{book.title} • ISBN {book.isbn}</span></>:<div className="card warn">Referensi buku/BAB SIBI untuk kombinasi ini belum dimasukkan agar aplikasi tidak mengarang nama BAB. Guru dapat memasukkannya melalui menu Import/Referensi pada pengembangan berikutnya.</div>}</div>
 {tab==="Dashboard"&&<><div className="grid"><div className="card"><h3>Peserta Didik</h3><b>{db.students.length}</b></div><div className="card"><h3>BAB Aktif</h3><b>{chapters.length}</b></div><div className="card"><h3>Asesmen</h3><b>Per BAB + Akhir Semester</b><p className="muted">STS tidak tersedia.</p></div></div><div className="card"><h3>Alur V5</h3><p>Kelas → Mapel → Buku SIBI → BAB → TP → ATP → Prota → Prosem → RPM → Nilai BAB → Nilai Akhir Semester → Rapor.</p></div></>}
 {["CP","TP","ATP","Prota","Prosem"].includes(tab)&&<div className="card"><h2>{tab}</h2><p className="muted">Dokumen dapat ditulis sesuai kurikulum sekolah dan dikaitkan dengan BAB buku yang dipilih.</p><textarea rows="10" placeholder={"Masukkan "+tab+" untuk Kelas "+kelas+" — "+mapel}></textarea><button onClick={()=>setNotice(tab+" siap disimpan pada pengembangan berikutnya.")}>Simpan</button></div>}
 {tab==="RPM Deep Learning"&&<div className="card"><h2>RPM Deep Learning per BAB</h2>{chapters.length?<><select>{chapters.map((c,i)=><option>Bab {i+1} — {c}</option>)}</select><textarea rows="5" placeholder="Identifikasi kebutuhan belajar"></textarea><textarea rows="6" placeholder="Memahami • Mengaplikasi • Merefleksi • Tindak lanjut"></textarea><button onClick={()=>setNotice("RPM dicatat sebagai rancangan per BAB.")}>Simpan RPM</button></>:<p>BAB SIBI belum tersedia untuk pilihan ini.</p>}</div>}
 {tab==="Penilaian Per BAB"&&<div className="card"><h2>Penilaian Per BAB</h2><p className="muted">Nilai 0–100. Kolom akhir adalah Nilai Akhir Semester. Tidak ada STS.</p>{chapters.map((c,i)=><span className="tag">B{i+1}: {c}</span>)}<hr/><button onClick={add}>+ Tambah Siswa</button><div style={{overflowX:"auto"}}><table><thead><tr><th>Siswa</th>{chapters.map((c,i)=><th>B{i+1}</th>)}<th>Akhir Sem.</th><th>Aksi</th></tr></thead><tbody>{db.students.map(s=><tr><td><input value={s.name} onChange={e=>upd(s.id,"name",e.target.value)}/><input placeholder="NIS/NISN" value={s.nis} onChange={e=>upd(s.id,"nis",e.target.value)}/></td>{chapters.map(c=><td><input type="number" min="0" max="100" value={db.scores[s.id]?.[c]||""} onChange={e=>score(s.id,c,e.target.value)}/></td>)}<td><input type="number" min="0" max="100" value={db.scores[s.id]?.final||""} onChange={e=>score(s.id,"final",e.target.value)}/></td><td><button className="danger" onClick={()=>del(s.id)}>Hapus</button></td></tr>)}</tbody></table></div></div>}
 {tab==="Rapor"&&<div className="card"><h2>Rapor</h2><p>Rekap nilai akhir semester. Format cetak dapat dikembangkan setelah struktur sekolah, identitas guru, dan KKTP ditetapkan.</p><table><thead><tr><th>Siswa</th><th>Mapel</th><th>Nilai</th><th>Predikat</th></tr></thead><tbody>{db.students.map(s=>{let n=Number(db.scores[s.id]?.final||0);return <tr><td>{s.name}</td><td>{mapel}</td><td>{n}</td><td>{n>=90?"Sangat Baik":n>=80?"Baik":n>=70?"Cukup":"Perlu Bimbingan"}</td></tr>})}</tbody></table></div>}
 {tab==="Import Data"&&<div className="card"><h2>Import & Backup</h2><button onClick={backup}>Download Backup JSON</button><label>Import Backup JSON<input type="file" accept=".json" onChange={restore}/></label><hr/><h3>Referensi SIBI V5</h3><p>V5 sudah memuat katalog dan BAB yang berhasil diverifikasi. Untuk kombinasi yang belum terverifikasi, aplikasi sengaja tidak mengarang judul BAB.</p></div>}
 </main></>}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
