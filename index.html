<!doctype html><html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SI-NILAI SD V7 FINAL 2026/2027</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#172033}.top{background:#0f172a;color:#fff;padding:14px;position:sticky;top:0;z-index:5}.top h1{margin:0;font-size:19px}.layout{display:flex}.side{width:235px;background:#111827;min-height:calc(100vh - 60px);padding:10px;position:sticky;top:60px}.side button{display:block;width:100%;text-align:left;background:transparent;color:#fff;border:0;padding:10px;border-radius:8px;margin:2px 0}.side button.on{background:#2563eb}.main{flex:1;padding:12px;max-width:1250px;margin:auto;width:100%}.mobile{display:none;background:#fff;overflow:auto;white-space:nowrap;padding:7px;position:sticky;top:60px;z-index:4}.mobile button{margin-right:4px}.card{background:#fff;border-radius:13px;padding:15px;margin-bottom:12px;box-shadow:0 2px 10px #0000000d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:8px 0}.field label{display:block;font-weight:bold;font-size:13px;margin-bottom:4px}.field input,.field select,.field textarea{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:8px}.btn{background:#2563eb;color:#fff;border:0;border-radius:8px;padding:9px 12px;margin:3px;cursor:pointer}.gray{background:#e2e8f0;color:#172033}.red{background:#fee2e2;color:#b91c1c}.tag{display:inline-block;background:#dbeafe;color:#1d4ed8;padding:4px 8px;border-radius:20px;margin:3px;font-size:12px}.notice{padding:10px;border-radius:8px;background:#dcfce7;color:#166534;margin-bottom:10px}.warn{background:#fef3c7;color:#92400e}.table{overflow:auto}table{border-collapse:collapse;width:100%;min-width:700px}th,td{border-bottom:1px solid #e2e8f0;padding:7px;text-align:left;vertical-align:top;font-size:13px}th{background:#f8fafc}.title{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.stat{font-size:28px;font-weight:bold}@media(max-width:800px){.side{display:none}.mobile{display:block}.row{grid-template-columns:1fr}.main{padding:8px}}@media print{.top,.side,.mobile,.noprint{display:none!important}.main{padding:0}.card{box-shadow:none}}
</style></head><body>
<div class="top"><h1>SI-NILAI SD V7 FINAL — 2026/2027</h1><small>Kurikulum Merdeka • Fase A, B, C • Tanpa STS</small></div>
<div id="mobile" class="mobile"></div><div class="layout"><aside id="side" class="side"></aside><main id="app" class="main"></main></div>
<script>
"use strict";
const CL=["I","II","III","IV","V","VI"];
const MAPEL=["Bahasa Indonesia","Pendidikan Pancasila","Matematika","IPAS","PJOK","Seni Rupa","Seni Musik","Seni Tari","Seni Teater","Bahasa Inggris","Pendidikan Agama dan Budi Pekerti"];
const PH={I:"A",II:"A",III:"B",IV:"B",V:"C",VI:"C"};
const BAB={
"I|Bahasa Indonesia":["Bunyi Apa?","Ayo, Bermain!","Awas Kuman!","Aku Bisa!","Teman Baru","Berbeda Itu Tak Apa","Aku Ingin","Di Sekitar Rumah"],
"II|Bahasa Indonesia":["Mengenal Perasaan","Menjaga Kesehatan","Berhati-hati di Mana Saja","Keluargaku Unik","Berteman dalam Keragaman","Bijak Memakai Uang","Sayang Lingkungan","Hobi yang Jadi Prestasi"],
"III|Bahasa Indonesia":["Ayo, Main!","Kawan Seiring","Pengobar Semangat","Senyum di Sekitarku","Bola-Bola Cokelat","Tersesat","Aku dan si Merah"],
"IV|Bahasa Indonesia":["Sudah Besar","Di Bawah Atap","Lihat Sekitar","Meliuk dan Menerjang","Bertukar dan Membayar","Satu Titik","Asal-Usul","Sehatlah Ragaku"],
"V|Bahasa Indonesia":["Aku yang Unik","Buku Jendela Dunia","Ekspresi Diri melalui Hobi","Belajar Berwirausaha","Menjadi Warga Dunia","Cinta Indonesia","Sayangi Bumi","Bergerak Bersama"],
"VI|Bahasa Indonesia":["Bangga Menjadi Anak Indonesia","Musisi Indonesia di Pentas Dunia","Taman Nasional dan Situs Warisan Dunia","Jeda untuk Iklim","Anak-Anak yang Mengubah Dunia","Liburan Perpisahan Kelas","Aku Bisa Berempati","Aman di Dunia Maya"],
"IV|IPAS":["Tumbuhan, Sumber Kehidupan di Bumi","Wujud Zat dan Perubahannya","Gaya di Sekitar Kita","Mengubah Bentuk Energi","Cerita Tentang Daerahku","Indonesiaku Kaya Budaya","Bagaimana Mendapatkan Semua Kebutuhan Kita?","Membangun Masyarakat yang Beradab"],
"IV|Pendidikan Pancasila":["Mengenal Lingkungan Sekitar","Aku Anak yang Disiplin","Kerja Sama di Lingkunganku","Pancasila dalam Diriku"],
"IV|Matematika":["Bilangan Cacah sampai 10.000","Pecahan","Pola Gambar dan Pola Bilangan","Pengukuran Luas dan Volume","Bangun Datar","Piktogram dan Diagram Batang"]
};
const BASE={
"Bahasa Indonesia":["menyimak informasi dan memahami makna teks yang didengar","membaca dan memirsa teks sesuai tujuan serta menemukan informasi penting","berbicara dan mempresentasikan gagasan dengan santun, runtut, dan percaya diri","menulis berbagai teks sesuai tujuan, struktur, dan kaidah kebahasaan"],
"Pendidikan Pancasila":["memahami nilai Pancasila dan menerapkannya dalam kehidupan sehari-hari","menunjukkan sikap sesuai norma, aturan, hak dan kewajiban","memahami keberagaman dan membangun kerja sama","menunjukkan tanggung jawab sebagai warga sekolah, masyarakat, dan negara"],
"Matematika":["memahami bilangan dan operasi hitung sesuai fase","memahami pola, pengukuran, geometri, dan hubungan antarkonsep","mengolah, menyajikan, dan menafsirkan data","menggunakan penalaran dan strategi pemecahan masalah"],
"IPAS":["mengamati fenomena alam dan sosial berdasarkan bukti","menjelaskan konsep sains dan kehidupan sosial melalui penyelidikan","mengolah informasi dan hasil pengamatan untuk membuat kesimpulan","menunjukkan kepedulian terhadap lingkungan dan keberlanjutan"],
"PJOK":["mempraktikkan gerak dasar dan keterampilan aktivitas jasmani","menerapkan pola hidup sehat, kebugaran, keselamatan, dan sportivitas","mengembangkan kerja sama, disiplin, tanggung jawab, dan percaya diri"],
"Seni Rupa":["mengeksplorasi unsur, prinsip, alat, bahan, dan teknik seni rupa","menciptakan karya seni rupa berdasarkan gagasan dan pengalaman","merefleksikan karya dan menghargai karya orang lain"],
"Seni Musik":["mengeksplorasi bunyi, ritme, melodi, tempo, dan dinamika","memainkan atau menyanyikan karya musik secara ekspresif","mencipta, menampilkan, dan merefleksikan pengalaman bermusik"],
"Seni Tari":["mengeksplorasi gerak, ruang, waktu, tenaga, dan unsur tari","menciptakan dan menampilkan rangkaian gerak tari","menghargai keberagaman tari dan merefleksikan pengalaman berkarya"],
"Seni Teater":["mengeksplorasi tubuh, suara, ekspresi, ruang, dan karakter","memainkan adegan dengan kerja sama dan percaya diri","mencipta, menampilkan, dan merefleksikan pertunjukan teater"],
"Bahasa Inggris":["memahami makna ungkapan lisan dan tulisan sesuai konteks","berinteraksi menggunakan ungkapan untuk tujuan komunikasi","membaca dan menulis teks sederhana"],
"Pendidikan Agama dan Budi Pekerti":["memahami ajaran pokok agama sesuai keyakinan peserta didik","menerapkan nilai keimanan, ibadah, akhlak/budi pekerti","menunjukkan sikap toleran, bertanggung jawab, peduli, dan berbuat baik"]
};
function docs(k,m){
 let b=BASE[m]||BASE["Bahasa Indonesia"],tp=[];
 b.forEach(x=>{tp.push("Peserta didik mampu "+x+".");tp.push("Peserta didik mampu menerapkan "+x+" dalam konteks kehidupan sehari-hari.");});
 let atp=tp.map((x,i)=>({n:i+1,s:i<tp.length/2?1:2,t:x}));
 let rpm=(BAB[k+"|"+m]||[]).map((x,i)=>({n:i+1,t:x,tujuan:"Peserta didik memahami "+x+" dan mampu menerapkannya melalui pengalaman belajar bermakna.",kegiatan:"Pemantik → eksplorasi → kolaborasi → praktik → refleksi.",asesmen:"Observasi, unjuk kerja, produk/proyek, dan tes sesuai tujuan.",diferensiasi:"Konten, proses, produk, dan dukungan disesuaikan kebutuhan peserta didik."}));
 return {cp:"Fase "+PH[k]+": "+b.map(x=>x.charAt(0).toUpperCase()+x.slice(1)+".").join(" "),tp,atp,prota:atp.map(x=>({n:x.n,s:x.s,jp:4,m:x.t})),prosem:atp.map(x=>({n:x.n,s:x.s,minggu:(x.n%2)+1,m:x.t})),rpm};
}
const KEY="SINILAI_V7_FINAL_2026_2027";
let db=load(),tab="Dashboard",kelas="IV",mapel="Bahasa Indonesia",sem=1,logged=null;
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&x.docs)return x}catch(e){}let d={school:{name:"SD Contoh",guru:""},students:[],scores:{},guru:[{id:1,name:"Admin Guru",username:"guru",password:"123456",role:"Admin"}],docs:{}};CL.forEach(k=>MAPEL.forEach(m=>d.docs[k+"|"+m]=docs(k,m)));return d}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(x){return String(x??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function menu(){return["Dashboard","Data Siswa","Import Data Siswa","Login Guru","CP","TP","ATP","Prota","Prosem","RPM Deep Learning","Penilaian Per BAB","Rapor","Database Guru","Backup / Restore"]}
function drawMenus(){let h=menu().map(x=>`<button class="${tab===x?"on":""}" onclick="go('${x}')">${x}</button>`).join("");document.getElementById("side").innerHTML=h;document.getElementById("mobile").innerHTML=h}
function selectors(){return `<div class="card noprint"><div class="row"><div class="field"><label>Kelas</label><select onchange="kelas=this.value;render()">${CL.map(x=>`<option ${x===kelas?"selected":""}>${x}</option>`).join("")}</select></div><div class="field"><label>Mata Pelajaran</label><select onchange="mapel=this.value;render()">${MAPEL.map(x=>`<option ${x===mapel?"selected":""}>${x}</option>`).join("")}</select></div></div></div>`}
function go(x){tab=x;render()}
function render(){drawMenus();let d=db.docs[kelas+"|"+mapel]||docs(kelas,mapel),b=BAB[kelas+"|"+mapel]||[];let h=selectors();
if(tab==="Dashboard")h+=`<div class="card"><h2>Dashboard</h2><p>Administrasi pembelajaran SD 2026/2027 sudah berisi data dasar yang dapat diedit.</p></div><div class="grid"><div class="card"><div class="stat">${db.students.length}</div>Siswa</div><div class="card"><div class="stat">${Object.keys(db.scores).length}</div>Nilai</div><div class="card"><div class="stat">${MAPEL.length}</div>Mata Pelajaran</div><div class="card"><div class="stat">Fase ${PH[kelas]}</div>Kelas ${kelas}</div></div>`;
if(tab==="Data Siswa")h+=students();
if(tab==="Import Data Siswa")h+=`<div class="card"><h2>Import Data Siswa</h2><p>Format CSV: Nama,NIS,NISN,JK,Alamat</p><button class="btn" onclick="templateCSV()">Download Template CSV</button><input type="file" accept=".csv" onchange="importCSV(this)" class="field"></div>`;
if(tab==="Login Guru")h+=login();
if(["CP","TP","ATP","Prota","Prosem"].includes(tab))h+=docPage(tab,d);
if(tab==="RPM Deep Learning")h+=rpmPage(d,b);
if(tab==="Penilaian Per BAB")h+=scoresPage(b);
if(tab==="Rapor")h+=rapor(b);
if(tab==="Database Guru")h+=guruPage();
if(tab==="Backup / Restore")h+=backupPage();
document.getElementById("app").innerHTML=h}
function students(){return `<div class="card"><div class="title"><h2>Data Siswa</h2><button class="btn" onclick="addStudent()">+ Tambah Siswa</button></div><div class="table"><table><tr><th>No</th><th>Nama</th><th>NIS</th><th>NISN</th><th>JK</th><th>Alamat</th><th></th></tr>${db.students.map((s,i)=>`<tr><td>${i+1}</td><td><input value="${esc(s.name)}" onchange="stu(${s.id},'name',this.value)"></td><td><input value="${esc(s.nis)}" onchange="stu(${s.id},'nis',this.value)"></td><td><input value="${esc(s.nisn)}" onchange="stu(${s.id},'nisn',this.value)"></td><td><select onchange="stu(${s.id},'jk',this.value)"><option ${s.jk==="L"?"selected":""}>L</option><option ${s.jk==="P"?"selected":""}>P</option></select></td><td><input value="${esc(s.alamat)}" onchange="stu(${s.id},'alamat',this.value)"></td><td><button class="btn red" onclick="delStudent(${s.id})">Hapus</button></td></tr>`).join("")}</table></div></div>`}
function addStudent(){db.students.push({id:Date.now(),name:"Siswa Baru",nis:"",nisn:"",jk:"L",alamat:""});save();render()}
function stu(id,k,v){let s=db.students.find(x=>x.id===id);if(s){s[k]=v;save()}}
function delStudent(id){db.students=db.students.filter(x=>x.id!==id);save();render()}
function docPage(name,d){let k=name.toLowerCase();if(name==="CP")return `<div class="card"><h2>CP — Fase ${PH[kelas]}</h2><textarea rows="10" onchange="setDoc('cp',this.value)">${esc(d.cp)}</textarea></div>`;
let arr=d[k]||[];if(name==="TP")return `<div class="card"><h2>Tujuan Pembelajaran (TP)</h2>${arr.map((x,i)=>`<div class="field"><label>TP ${i+1}</label><textarea rows="2" onchange="setArr('tp',${i},this.value)">${esc(x)}</textarea></div>`).join("")}</div>`;
return `<div class="card"><h2>${name}</h2><div class="table"><table><tr><th>Urutan</th><th>Semester</th><th>Isi</th></tr>${arr.map((x,i)=>`<tr><td>${x.n}</td><td>${x.s}</td><td><textarea rows="2" onchange="setObj('${k}',${i},'${name==="Prota"?"m":name==="Prosem"?"m":"t"}',this.value)">${esc(name==="ATP"?x.t:x.m)}</textarea></td></tr>`).join("")}</table></div></div>`}
function setDoc(k,v){db.docs[kelas+"|"+mapel].cp=v;save()}function setArr(k,i,v){db.docs[kelas+"|"+mapel][k][i]=v;save()}function setObj(k,i,p,v){db.docs[kelas+"|"+mapel][k][i][p]=v;save()}
function rpmPage(d,b){if(!b.length)return `<div class="card"><h2>RPM Deep Learning</h2><div class="notice warn">BAB SIBI untuk kombinasi ${kelas} — ${mapel} belum diverifikasi, sehingga nama BAB tidak dibuat-buat.</div></div>`;return `<div class="card"><h2>RPM Deep Learning per BAB</h2><p>Rencana Pembelajaran Mendalam untuk setiap BAB SIBI.</p><div class="grid">${d.rpm.map(r=>`<div class="card"><b>BAB ${r.n}. ${esc(r.t)}</b><p><b>Tujuan:</b> ${esc(r.tujuan)}</p><p><b>Kegiatan:</b> ${esc(r.kegiatan)}</p><p><b>Asesmen:</b> ${esc(r.asesmen)}</p><p><b>Diferensiasi:</b> ${esc(r.diferensiasi)}</p></div>`).join("")}</div></div>`}
function skey(id,bab){return id+"|"+kelas+"|"+mapel+"|"+sem+"|"+bab}
function scoresPage(b){if(!b.length)return `<div class="card"><h2>Penilaian Per BAB</h2><div class="notice warn">BAB SIBI belum diverifikasi untuk ${kelas} — ${mapel}. Tidak ada BAB fiktif.</div></div>`;return `<div class="card"><h2>Penilaian Per BAB</h2><p>Semester <select onchange="sem=Number(this.value);render()"><option value="1" ${sem===1?"selected":""}>1</option><option value="2" ${sem===2?"selected":""}>2</option></select> • STS tidak digunakan.</p><div class="table"><table><tr><th>Siswa</th>${b.map((x,i)=>`<th>BAB ${i+1}<br>${esc(x)}</th>`).join("")}<th>Akhir Semester</th></tr>${db.students.map(s=>`<tr><td>${esc(s.name)}</td>${b.map((x,i)=>`<td><input type="number" min="0" max="100" value="${db.scores[skey(s.id,i+1)]||""}" onchange="score(${s.id},${i+1},this.value)"></td>`).join("")}<td><input type="number" min="0" max="100" value="${db.scores[skey(s.id,99)]||""}" onchange="score(${s.id},99,this.value)"></td></tr>`).join("")}</table></div></div>`}
function score(id,b,v){db.scores[skey(id,b)]=v;save()}
function rapor(b){return `<div class="card"><div class="title"><h2>Rapor</h2><button class="btn" onclick="window.print()">Cetak / PDF</button></div><div class="field"><label>Nama Sekolah</label><input value="${esc(db.school.name)}" onchange="db.school.name=this.value;save()"></div><div class="table"><table><tr><th>No</th><th>Nama</th><th>Mapel</th><th>Rata-rata BAB</th><th>Akhir Semester</th><th>Deskripsi</th></tr>${db.students.map((s,i)=>{let v=b.map((_,j)=>Number(db.scores[skey(s.id,j+1)])).filter(x=>x>0),a=v.length?(v.reduce((p,q)=>p+q,0)/v.length).toFixed(1):"-",ak=db.scores[skey(s.id,99)]||"-";return `<tr><td>${i+1}</td><td>${esc(s.name)}</td><td>${esc(mapel)}</td><td>${a}</td><td>${ak}</td><td>${a==="-"?"Belum ada nilai.":Number(a)>=90?"Sangat Baik.":Number(a)>=80?"Baik.":"Perlu penguatan."}</td></tr>`}).join("")}</table></div></div>`}
function login(){if(logged)return `<div class="card"><h2>Login Guru</h2><div class="notice">Masuk sebagai <b>${esc(logged.name)}</b> (${esc(logged.role)})</div><button class="btn" onclick="logged=null;render()">Keluar</button></div>`;return `<div class="card"><h2>Login Guru</h2><div class="row"><div class="field"><label>Username</label><input id="u" value="guru"></div><div class="field"><label>Password</label><input id="p" type="password" value="123456"></div></div><button class="btn" onclick="loginNow()">Masuk</button><p class="muted">Akun demo: guru / 123456</p></div>`}
function loginNow(){let u=document.getElementById("u").value,p=document.getElementById("p").value;logged=db.guru.find(g=>g.username===u&&g.password===p)||null;if(!logged)alert("Username/password salah.");render()}
function guruPage(){return `<div class="card"><h2>Database Guru</h2><p class="muted">Database guru lokal pada perangkat/browser ini.</p>${db.guru.map(g=>`<div class="card"><b>${esc(g.name)}</b><br>Username: ${esc(g.username)} • Role: ${esc(g.role)}<br><button class="btn red" onclick="delGuru(${g.id})">Hapus</button></div>`).join("")}<button class="btn" onclick="addGuru()">+ Tambah Guru</button></div>`}
function addGuru(){let n=prompt("Nama guru"),u=prompt("Username"),p=prompt("Password");if(n&&u&&p){db.guru.push({id:Date.now(),name:n,username:u,password:p,role:"Guru"});save();render()}}
function delGuru(id){if(db.guru.length<=1)return alert("Minimal satu akun guru.");db.guru=db.guru.filter(g=>g.id!==id);save();render()}
function backupPage(){return `<div class="card"><h2>Backup / Restore</h2><button class="btn" onclick="backup()">Download Backup JSON</button><input type="file" accept=".json" onchange="restore(this)" class="field"><p class="muted">Data tersimpan lokal. Untuk database bersama antar-HP diperlukan backend PostgreSQL/Neon.</p></div>`}
function backup(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));a.download="backup-si-nilai-2026-2027.json";a.click()}
function restore(el){let f=el.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();render();alert("Restore berhasil.")}catch(e){alert("Backup tidak valid.")}};r.readAsText(f)}
function templateCSV(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["Nama,NIS,NISN,JK,Alamat\nContoh Siswa,001,1234567890,L,Jalan Contoh\n"],{type:"text/csv"}));a.download="template-data-siswa.csv";a.click()}
function importCSV(el){let f=el.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let ls=r.result.split(/\r?\n/).filter(Boolean).slice(1);ls.forEach((x,i)=>{let a=x.split(",");db.students.push({id:Date.now()+i,name:a[0]||"",nis:a[1]||"",nisn:a[2]||"",jk:a[3]||"",alamat:a.slice(4).join(",")})});save();render();alert("Data siswa berhasil diimpor.")};r.readAsText(f)}
render();
</script></body></html>
